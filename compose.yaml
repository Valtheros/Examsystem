name: examsystem

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: examsystem
      POSTGRES_USER: exam_app
      POSTGRES_PASSWORD: exam_local_password
      TZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - examsystem_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam_app -d examsystem"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - examsystem_minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
        mc mb --ignore-existing local/exam-files;
        mc anonymous set none local/exam-files;

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  examsystem_postgres:
  examsystem_minio:
